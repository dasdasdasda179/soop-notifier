name: SOOP Live Notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run notifier
        env:
          TOKEN_MINTYERIM07: ${{ secrets.TOKEN_MINTYERIM07 }}
          CHANNEL_MINTYERIM07: ${{ secrets.CHANNEL_MINTYERIM07 }}
          TOKEN_SERENA06: ${{ secrets.TOKEN_SERENA06 }}
          CHANNEL_SERENA06: ${{ secrets.CHANNEL_SERENA06 }}
        run: python notifier.py

      - name: Save state if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "Update live state [skip ci]"
            git pull --rebase origin main
            git push
          fi
